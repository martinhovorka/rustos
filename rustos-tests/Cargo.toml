# REQ: TEST-001 - Test Suite
# rustos-tests: Host-based test suite for RustOS

[package]
name = "rustos-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-based test suite for RustOS RTOS"

[dependencies]
# REQ: DEP-010 - Static data structures
heapless = { workspace = true }

# REQ: DEP-007 - Atomic operations for tests
portable-atomic = { workspace = true }

[dev-dependencies]

[features]
default = []
# Enable for benchmark binary
bench = []

# REQ: TEST-005 - Library with tests
[lib]
name = "rustos_tests"
path = "src/lib.rs"

# Performance benchmark binary
[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

# REQ: TEST-006 - Test with standard library on host
[package.metadata.docs.rs]
all-features = true
