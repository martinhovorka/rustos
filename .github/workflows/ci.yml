# REQ: CI-001 - CI/CD Configuration for GitHub Actions
# Integrates build.sh, test.sh, and comprehensive qa.sh quality checks
#
# qa.sh sections:
#   1  - Code Formatting & Style (QUAL-006)
#   2  - Build Verification (BUILD-003, TEST-001)
#   3  - Test Execution (QUAL-020/021, COV-001/006/007/008)
#   4  - Code Linting (QUAL-005)
#   5  - Unsafe Code & Safety (SAFE-002/007/008, VER-009)
#   6  - Security Analysis (TEST-012, SEC-002/004)
#   7  - Documentation (QUAL-001)
#   8  - Code Complexity (QUAL-009/010, RUST-006)
#   9  - Dependencies (CI-006/008)
#   10 - Requirements Traceability (VER-012/014/015)
#   11 - Binary Size Analysis (CI-005, MEM-001)
#   12 - Performance Benchmarks
#   13 - RTOS-Specific Checks (QUAL-002/003/004)

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # REQ: CI-002 - Build job using build.sh
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        targets: riscv32imac-unknown-none-elf
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-
    
    - name: Make scripts executable
      run: chmod +x build.sh test.sh clean.sh coverage.sh qa.sh
    
    - name: Clean (via clean.sh)
      run: ./clean.sh
    
    - name: Build (via build.sh)
      run: ./build.sh

  # REQ: CI-003 - Test job using test.sh
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-test-
    
    - name: Make scripts executable
      run: chmod +x test.sh clean.sh
    
    - name: Clean (via clean.sh)
      run: ./clean.sh
    
    - name: Run tests (via test.sh)
      run: ./test.sh

  # REQ: QUAL-006 - Formatting check using qa.sh section 1
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        components: rustfmt
    
    - name: Make scripts executable
      run: chmod +x qa.sh
    
    - name: Check formatting (via qa.sh --section 1)
      run: ./qa.sh --section 1

  # REQ: CI-004 - Lint job using qa.sh section 4
  lint:
    runs-on: ubuntu-latest
    needs: format
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        targets: riscv32imac-unknown-none-elf
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-lint-
    
    - name: Make scripts executable
      run: chmod +x qa.sh
    
    - name: Run linter (via qa.sh --section 4)
      run: ./qa.sh --section 4

  # REQ: CI-006, CI-007 - Safety & Security audit (qa.sh sections 5 & 6)
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        targets: riscv32imac-unknown-none-elf
        components: clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-audit-
    
    - name: Install audit tools
      run: |
        cargo install cargo-audit
        cargo install cargo-geiger
    
    - name: Make scripts executable
      run: chmod +x qa.sh
    
    - name: Run safety audit (section 5)
      run: ./qa.sh --section 5
    
    - name: Run security audit (section 6)
      run: ./qa.sh --section 6
    
    - name: Upload audit logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: audit-logs
        path: artifacts/qa/
        retention-days: 30

  # REQ: CI-005, COV-001 - Coverage job using coverage.sh
  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        components: llvm-tools-preview
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-coverage-
    
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov
    
    - name: Make scripts executable
      run: chmod +x coverage.sh clean.sh
    
    - name: Clean (via clean.sh)
      run: ./clean.sh
    
    - name: Generate coverage (via coverage.sh + codecov output)
      run: |
        cargo llvm-cov clean --workspace
        cargo llvm-cov \
          -p rustos-tests \
          --target x86_64-unknown-linux-gnu \
          --codecov \
          --output-path codecov.json \
          -- --test-threads=1
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: codecov.json
        fail_ci_if_error: false
        verbose: true

  # REQ: CI-008 - Documentation job
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        targets: riscv32imac-unknown-none-elf
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-docs-
    
    - name: Make scripts executable
      run: chmod +x qa.sh
    
    - name: Build documentation (via qa.sh --section 7)
      run: ./qa.sh --section 7
    
    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdoc
        path: |
          target/doc/
          docs/
          TEST_COVERAGE_REPORT.md
          README.md
          QA_README.md
          IMPLEMENTATION_STATUS.md
          CHANGELOG.md
        retention-days: 7

  # REQ: CI-005, MEM-001 - Binary size check using qa.sh section 11
  binary-size:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        targets: riscv32imac-unknown-none-elf
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-binary-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-binary-
    
    - name: Make scripts executable
      run: chmod +x qa.sh build.sh clean.sh
    
    - name: Clean (via clean.sh)
      run: ./clean.sh
    
    - name: Build release binary (via build.sh)
      run: ./build.sh
    
    - name: Check binary size (via qa.sh --section 11)
      run: ./qa.sh --section 11

  # REQ: QUAL-002/003/004 - RTOS-specific checks using qa.sh section 13
  rtos-checks:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        targets: riscv32imac-unknown-none-elf
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-rtos-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-rtos-
    
    - name: Make scripts executable
      run: chmod +x qa.sh build.sh clean.sh
    
    - name: Clean (via clean.sh)
      run: ./clean.sh
    
    - name: Build release binary (via build.sh)
      run: ./build.sh
    
    - name: Run RTOS-specific checks (via qa.sh --section 13)
      run: ./qa.sh --section 13

  # REQ: CI-009 - Quality gate (runs all qa.sh checks with verbose output)
  quality-gate:
    runs-on: ubuntu-latest
    needs: [build, test, format, lint, audit, binary-size, rtos-checks]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust (stable)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.92.0
        targets: riscv32imac-unknown-none-elf
        components: rustfmt, clippy
    
    - name: Install Rust (nightly for udeps)
      uses: dtolnay/rust-toolchain@nightly
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-quality-
    
    - name: Install quality tools
      run: |
        cargo install cargo-audit
        cargo +nightly install cargo-udeps --locked
        cargo install cargo-geiger
        cargo install cargo-llvm-cov
    
    - name: Make scripts executable
      run: chmod +x qa.sh clean.sh
    
    - name: Clean (via clean.sh)
      run: ./clean.sh
    
    - name: Run comprehensive QA with verbose output
      run: ./qa.sh --verbose --report
    
    - name: Upload all generated artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rustos-artifacts
        path: artifacts/
        retention-days: 30
